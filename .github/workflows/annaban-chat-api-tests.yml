name: AnnabanAI chat API tests

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "annaban_llm/**"
      - "RESEARCH_INDEX.md"
      - ".github/workflows/annaban-chat-api-tests.yml"
  pull_request:
    paths:
      - "annaban_llm/**"
      - "RESEARCH_INDEX.md"
      - ".github/workflows/annaban-chat-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-api-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: annaban_llm/requirements.txt
      - name: Install API and test dependencies
        run: python -m pip install -r annaban_llm/requirements.txt
      - name: Run chat API contract tests
        run: python -m pytest -q annaban_llm/test_api_server.py
